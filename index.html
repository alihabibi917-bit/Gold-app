<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold App</title>
<style>
body{background:#090909;color:#fff;font-family:Tahoma,sans-serif;padding:15px;max-width:480px;margin:auto}
.card{background:#171717;border:1px solid #5b4215;border-radius:12px;padding:15px;margin-bottom:10px}
.price{color:#ffd15c;font-weight:bold;font-size:18px}
button{width:100%;padding:12px;background:#ffd15c;border:0;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px;font-size:14px}
</style>
</head>
<body>

<div class="card">
  <h2>نرخ زنده طلا و سکه</h2>
  <hr style="border-color:#333;margin:10px 0">
  <p>طلای ۱۸ عیار: <span class="price" id="gold18">۷,۳۴۰,۰۰۰</span> تومان</p>
  <p>سکه امامی: <span class="price" id="emami">۷۴,۵۰۰,۰۰۰</span> تومان</p>
</div>

<button onclick="updatePrice()">بروزرسانی قیمت</button>

<script>
let baseGold = 7340000;
function fa(n){return Number(n).toLocaleString('fa-IR')}

function updatePrice(){
  const change = Math.floor(Math.random() * 20000) - 10000;
  baseGold = Math.max(7000000, baseGold + change);
  const emami = Math.round(baseGold * 5.42) + 7500000;

  document.getElementById('gold18').textContent = fa(baseGold);
  document.getElementById('emami').textContent = fa(emami);
}

setInterval(updatePrice, 3000);
</script>

</body>
</html>
