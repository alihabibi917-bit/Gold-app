<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Gold & Forex Super App</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --green: #10b981;
            --red: #ef4444;
            /* استایل کلیدهای برجسته و سه‌بعدی */
            --btn-bg: linear-gradient(145deg, #233048, #1a2336);
            --btn-shadow-1: 5px 5px 10px #090e1a, -5px -5px 10px #334466;
            --btn-active-shadow: inset 3px 3px 6px #090e1a, inset -3px -3px 6px #334466;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            max-width: 480px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 14px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .header h1 { font-size: 15px; color: var(--accent-gold); }
        
        /* انتخابگر زبان */
        .lang-select {
            background: #0f172a;
            color: var(--accent-gold);
            border: 1px solid #334155;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }

        /* تب‌ها با کلیدهای برجسته */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .tab-btn {
            background: var(--btn-bg);
            border: none;
            color: var(--text-secondary);
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            box-shadow: var(--btn-shadow-1);
            transition: 0.1s;
            white-space: nowrap;
        }
        .tab-btn:active, .tab-btn.active {
            box-shadow: var(--btn-active-shadow);
            color: var(--accent-gold);
            font-weight: bold;
        }

        .section { display: none; }
        .section.active { display: block; }

        .card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        .card-title {
            font-size: 14px;
            color: var(--accent-gold);
            margin-bottom: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 6px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 13px;
        }
        .row:last-child { border-bottom: none; }
        .value-green { color: var(--green); font-weight: bold; }
        .value-red { color: var(--red); font-weight: bold; }

        /* فرم‌ها و کلیدهای برجسته اصلی */
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; }
        .input-group input {
            width: 100%;
            padding: 11px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
        }
        
        .action-btn {
            width: 100%;
            background: var(--btn-bg);
            color: var(--accent-gold);
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: var(--btn-shadow-1);
            font-size: 14px;
            margin-top: 5px;
            transition: 0.1s;
        }
        .action-btn:active {
            box-shadow: var(--btn-active-shadow);
            transform: scale(0.98);
        }
        .result-box {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 13px;
            text-align: center;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="appTitle">سوپر اپ طلا و فارکس</h1>
        <select class="lang-select" id="langSelector" onchange="changeLanguage(this.value)">
            <option value="fa">فارسی (FA)</option>
            <option value="en">English (EN)</option>
            <option value="ar">العربية (AR)</option>
            <option value="zh">中文 (ZH)</option>
            <option value="es">Español (ES)</option>
        </select>
    </div>

    <!-- منوی تب‌های برجسته -->
    <div class="tabs">
        <button class="tab-btn active" id="tabMarket" onclick="switchTab(event, 'market')">📊 بازار</button>
        <button class="tab-btn" id="tabCalc" onclick="switchTab(event, 'bubble-calc')">🧮 محاسبه حباب</button>
        <button class="tab-btn" id="tabSignal" onclick="switchTab(event, 'signals')">📈 سیگنال MT5</button>
    </div>

    <!-- تب اول: بازار -->
    <div id="market" class="section active">
        <div class="card">
            <div class="card-title" id="marketRatesTitle">نرخ‌های زنده بازار جهانی</div>
            <div class="row">
                <span id="txtGoldOunce">انس جهانی (XAU/USD)</span>
                <span class="value-green">$4,350.36</span>
            </div>
            <div class="row">
                <span id="txtEmami">سکه امامی</span>
                <span>48,500,000</span>
            </div>
            <div class="row">
                <span id="txtGold18">طلای ۱۸ عیار</span>
                <span>24,100,000</span>
            </div>
        </div>
    </div>

    <!-- تب دوم: محاسبه‌گر حباب -->
    <div id="bubble-calc" class="section">
        <div class="card">
            <div class="card-title" id="calcCardTitle">ماشین‌حساب پیشرفته حباب</div>
            <div class="input-group">
                <label id="lblMarketPrice">قیمت بازار سکه:</label>
                <input type="number" id="marketPrice" placeholder="48500000">
            </div>
            <div class="input-group">
                <label id="lblGold18Price">قیمت طلای ۱۸ عیار:</label>
                <input type="number" id="gold18Price" placeholder="24100000">
            </div>
            <button class="action-btn" id="btnCalculate" onclick="calculateBubble()">محاسبه ارزش ذاتی و حباب</button>
            <div class="result-box" id="calcResult">نتیجه در اینجا نمایش داده می‌شود</div>
        </div>
    </div>

    <!-- تب سوم: سیگنال‌ها -->
    <div id="signals" class="section">
        <div class="card">
            <div class="card-title">MT5 Signal <span class="value-green">● BUY</span></div>
            <div class="row"><span>Entry:</span> <span>2,650.0</span></div>
            <div class="row"><span>Stop Loss:</span> <span class="value-red">2,642.0</span></div>
            <div class="row"><span>Take Profit:</span> <span class="value-green">2,668.0</span></div>
            <button class="action-btn" onclick="playClickSound(); alert('Signal Copied!');">📋 کپی پارامترها</button>
        </div>
    </div>

    <script>
        // سیستم پخش صدای ملایم لمس (بدون نیاز به فایل صوتی خارجی)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playClickSound() {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime); // فرکانس صدای ملایم
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime); // حجم صدای بسیار کم و ملایم
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        // افزودن صدای لمس به تمامی دکمه‌ها و کلیدها به صورت خودکار
        document.querySelectorAll('button, select').forEach(element => {
            element.addEventListener('click', playClickSound);
        });

        // مدیریت تب‌ها
        function switchTab(evt, sectionId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        // دیکشنری زبان‌های مختلف دنیا
        const translations = {
            fa: {
                title: "سوپر اپ طلا و فارکس",
                market: "📊 بازار",
                calc: "🧮 محاسبه حباب",
                signal: "📈 سیگنال MT5",
                marketTitle: "نرخ‌های زنده بازار جهانی",
                goldOunce: "انس جهانی (XAU/USD)",
                emami: "سکه امامی",
                gold18: "طلای ۱۸ عیار",
                calcTitle: "ماشین‌حساب پیشرفته حباب",
                lblMarket: "قیمت بازار سکه:",
                lblGold: "قیمت طلای ۱۸ عیار:",
                btnCalc: "محاسبه ارزش ذاتی و حباب",
                resultWait: "نتیجه در اینجا نمایش داده می‌شود"
            },
            en: {
                title: "Gold & Forex Super App",
                market: "📊 Market",
                calc: "🧮 Bubble Calc",
                signal: "📈 MT5 Signal",
                marketTitle: "Live Global Market Rates",
                goldOunce: "Gold Ounce (XAU/USD)",
                emami: "Emami Coin",
                gold18: "18K Gold (Gram)",
                calcTitle: "Advanced Bubble Calculator",
                lblMarket: "Market Coin Price:",
                lblGold: "18K Gold Price:",
                btnCalc: "Calculate Intrinsic Value & Bubble",
                resultWait: "Result will be displayed here"
            },
            ar: {
                title: "تطبيق الذهب والفوركس",
                market: "📊 السوق",
                calc: "🧮 حاسبة الفقاعة",
                signal: "📈 إشارات MT5",
                marketTitle: "أسعار السوق العالمية المباشرة",
                goldOunce: "أونصة الذهب (XAU/USD)",
                emami: "عملة الإمامي",
                gold18: "عيار 18",
                calcTitle: "حاسبة الفقاعة المتقدمة",
                lblMarket: "سعر العملة في السوق:",
                lblGold: "سعر عيار 18:",
                btnCalc: "حساب القيمة الجوهرية والفقاعة",
                resultWait: "سيتم عرض النتيجة هنا"
            },
            zh: {
                title: "黄金与外汇超级应用",
                market: "📊 市场",
                calc: "🧮 泡沫计算器",
                signal: "📈 MT5 信号",
                marketTitle: "实时全球市场汇率",
                goldOunce: "国际黄金 (XAU/USD)",
                emami: "伊玛米金币",
                gold18: "18K 黄金",
                calcTitle: "高级泡沫计算器",
                lblMarket: "市场金币价格:",
                lblGold: "18K黄金价格:",
                btnCalc: "计算内在价值与泡沫",
                resultWait: "结果将显示在此处"
            },
            es: {
                title: "Súper App de Oro y Forex",
                market: "📊 Mercado",
                calc: "🧮 Calc de Burbuja",
                signal: "📈 Señal MT5",
                marketTitle: "Precios Globales en Vivo",
                goldOunce: "Onza de Oro (XAU/USD)",
                emami: "Moneda Emami",
                gold18: "Oro 18K",
                calcTitle: "Calculadora Avanzada de Burbuja",
                lblMarket: "Precio de la Moneda:",
                lblGold: "Precio de Oro 18K:",
                btnCalc: "Calcular Valor Intrínseco y Burbuja",
                resultWait: "El resultado se mostrará aquí"
            }
        };

        // تغییر زبان برنامه به صورت زنده
        function changeLanguage(lang) {
            const t = translations[lang];
            const root = document.getElementById('htmlRoot');
            
            // تنظیم جهت صفحه (RTL برای فارسی و عربی، LTR برای بقیه)
            if (lang === 'fa' || lang === 'ar') {
                root.setAttribute('dir', 'rtl');
                root.setAttribute('lang', lang);
            } else {
                root.setAttribute('dir', 'ltr');
                root.setAttribute('lang', lang);
            }

            document.getElementById('appTitle').innerText = t.title;
            document.getElementById('tabMarket').innerText = t.market;
            document.getElementById('tabCalc').innerText = t.calc;
            document.getElementById('tabSignal').innerText = t.signal;
            document.getElementById('marketRatesTitle').innerText = t.marketTitle;
            document.getElementById('txtGoldOunce').innerText = t.goldOunce;
            document.getElementById('txtEmami').innerText = t.emami;
            document.getElementById('txtGold18').innerText = t.gold18;
            document.getElementById('calcCardTitle').innerText = t.calcTitle;
            document.getElementById('lblMarketPrice').innerText = t.lblMarket;
            document.getElementById('lblGold18Price').innerText = t.lblGold;
            document.getElementById('btnCalculate').innerText = t.btnCalc;
        }

        // محاسبه حباب
        function calculateBubble() {
            const market = parseFloat(document.getElementById('marketPrice').value);
            const gold18 = parseFloat(document.getElementById('gold18Price').value);

            if (!market || !gold18) {
                document.getElementById('calcResult').innerHTML = "لطفاً مقادیر معتبر وارد کنید / Please enter valid values";
                return;
            }

            const intrinsicValue = (gold18 * 7.322) + 250000;
            const bubbleAmount = market - intrinsicValue;
            const bubblePercent = ((bubbleAmount / intrinsicValue) * 100).toFixed(2);

            document.getElementById('calcResult').innerHTML = `
                Intrinsic Value: <b>${Math.round(intrinsicValue).toLocaleString()}</b><br>
                Bubble: <span style="color: ${bubbleAmount >= 0 ? '#ef4444' : '#10b981'}">
                ${Math.round(bubbleAmount).toLocaleString()} (${bubblePercent}%)</span>
            `;
        }
    </script>
</body>
</html>
