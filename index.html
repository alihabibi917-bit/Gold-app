<script>
function changeTheme(theme){
  document.documentElement.setAttribute('data-theme',theme);
  localStorage.setItem('autoTheme',theme);
  document.querySelector('meta[name="theme-color"]').setAttribute('content',getComputedStyle(document.documentElement).getPropertyValue('--bg').trim());
}

function switchTab(evt,id){
  document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  evt.currentTarget.classList.add('active');
}

function fa(n){return Number(n).toLocaleString('fa-IR')}

function updateDateTime(){
  const now = new Date();
  const options = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', calendar: 'persian' };
  document.getElementById('liveDateTime').textContent = new Intl.DateTimeFormat('fa-IR', options).format(now);
}
setInterval(updateDateTime, 1000);

// ========== قیمت‌های پایه دقیق امروز (۱۷ سپتامبر ۲۰۲۶) ==========
let baseGold18   = 23300000;      // طلای ۱۸ عیار (تومان)
let baseOunceGold = 4361.35;      // انس طلا (دلار)
let baseOunceSilver = 65.50;      // انس نقره (دلار)

function liveAutoUpdate(){
  // نوسان واقعی کوچک برای طلای داخلی (هر چند ثانیه)
  const goldChange = Math.floor(Math.random() * 18000) - 9000; // ±۹ هزار تومان
  baseGold18 = Math.max(22000000, baseGold18 + goldChange);

  // محاسبه بقیه قیمت‌ها با فرمول‌های استاندارد بازار
  const gold24   = Math.round(baseGold18 * 1.3333);
  const mesghal  = Math.round(baseGold18 * 4.331);          // مثقال ≈ ۴.۳۳۱ گرم ۱۸ عیار
  const intrinsicCoin = Math.round(baseGold18 * 8.13);      // ارزش ذاتی تقریبی سکه امامی
  const emami    = intrinsicCoin + 42000000;                // + حباب فعلی بازار

  // نوسان انس جهانی
  baseOunceGold   += (Math.random() * 2.8 - 1.4);
  baseOunceSilver += (Math.random() * 0.25 - 0.12);

  // به‌روزرسانی DOM
  document.getElementById('gold18').textContent        = fa(baseGold18);
  document.getElementById('gold18Metric').textContent  = fa(baseGold18);
  document.getElementById('gold24').textContent        = fa(gold24);
  document.getElementById('mesghal').textContent       = fa(mesghal);
  document.getElementById('ounceGold').textContent     = '$' + baseOunceGold.toFixed(2);
  document.getElementById('ounceSilver').textContent   = '$' + baseOunceSilver.toFixed(2);

  document.getElementById('emami').textContent         = fa(emami);
  document.getElementById('coinMetric').textContent    = fa(emami);
  document.getElementById('bahar').textContent         = fa(Math.round(emami * 0.989));
  document.getElementById('nim').textContent           = fa(Math.round(emami * 0.508));
  document.getElementById('rob').textContent           = fa(Math.round(emami * 0.270));
  document.getElementById('garmi').textContent         = fa(Math.round(emami * 0.138));

  // همگام‌سازی ورودی‌های حباب‌سنج
  if(document.getElementById('intrinsicPrice')) {
    document.getElementById('intrinsicPrice').value = intrinsicCoin;
  }
  if(document.getElementById('marketCoinPrice')) {
    document.getElementById('marketCoinPrice').value = emami;
  }
}

// بروزرسانی هر ۲.۵ ثانیه (نزدیک به لحظه‌ای)
setInterval(liveAutoUpdate, 2500);

// تلاش برای گرفتن قیمت واقعی انس طلا از API رایگان (اگر CORS اجازه دهد)
async function fetchRealGoldPrice(){
  try {
    const res = await fetch('https://api.goldprice.dev/v1/prices?symbol=XAU-USD-SPOT');
    const data = await res.json();
    if(data?.symbols?.[0]?.price){
      baseOunceGold = parseFloat(data.symbols[0].price);
      document.getElementById('ounceGold').textContent = '$' + baseOunceGold.toFixed(2);
    }
  } catch(e){
    // در صورت خطا همان شبیه‌سازی ادامه می‌دهد
  }
}

// هر ۳۰ ثانیه یک‌بار انس واقعی را چک کند
setInterval(fetchRealGoldPrice, 30000);
fetchRealGoldPrice(); // اولین بار

// ========== بقیه توابع بدون تغییر ==========
function calculateBubble(){
  const market = Number(document.getElementById('marketCoinPrice').value);
  const intrinsic = Number(document.getElementById('intrinsicPrice').value);
  if(!market || !intrinsic) return;
  const bubble = market - intrinsic;
  const pct = (bubble / intrinsic * 100).toFixed(2);
  
  let rec = pct > 20 ? "❌ <b>توصیه: نخرید!</b> (حباب در محدوده بسیار خطرناک است)" : 
            pct > 12 ? "⚠️ <b>توصیه: احتیاط کنید</b> (حباب نسبتا بالا است)" : 
            "✅ <b>توصیه: مناسب برای خرید پله‌ای</b> (حباب منطقی)";

  document.getElementById('bubbleResult').innerHTML =
    'ارزش ذاتی: <b>' + fa(intrinsic) + '</b> تومان<br>' +
    'مقدار حباب: <b style="color:' + (bubble >= 0 ? 'var(--down)' : 'var(--up)') + '">' + fa(bubble) + ' تومان (' + pct + '٪)</b><br><br>' + rec;
}
